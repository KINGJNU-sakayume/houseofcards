name: Foundation replay batch (not AI balance)
on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sim -- --seeds 500
